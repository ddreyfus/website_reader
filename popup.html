<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Reader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="heading">
        <div>
          <p class="eyebrow">CURRENT ISSUE</p>
          <h1>Website Reader</h1>
        </div>
        <span aria-hidden="true" class="edition-mark">§</span>
      </div>

      <p id="status" role="status" aria-atomic="true">Open an Economist weekly edition page to begin.</p>

      <div class="controls">
        <button id="collect" class="primary" type="button">Collect edition</button>
        <button id="continue" type="button" hidden disabled>Continue collection</button>
        <button id="download-log" type="button" disabled>Download latest log</button>
      </div>

      <details>
        <summary>Latest detailed log</summary>
        <pre id="log">No collection has run yet.</pre>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
