<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Reader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="heading">
        <div>
          <p class="eyebrow">CURRENT READING BATCH</p>
          <h1>Website Reader</h1>
        </div>
        <button id="close" type="button" aria-label="Close Website Reader">Close</button>
      </div>

      <p id="status" role="status" aria-atomic="true">Open a supported publication issue page to begin.</p>

      <label id="email-label" hidden>Expanded email
        <select id="email-message" aria-label="Expanded email"></select>
      </label>

      <div class="controls">
        <button id="collect" class="primary" type="button">Collect issue</button>
        <button id="continue" type="button" hidden disabled>Continue collection</button>
        <button id="skip" type="button" hidden disabled>Skip article</button>
        <button id="handoff" type="button" disabled>Open in ChatGPT</button>
        <button id="copy" type="button">Copy digest prompt</button>
        <button id="download-log" type="button" disabled>Download latest log</button>
      </div>

      <details>
        <summary>Latest detailed log</summary>
        <pre id="log">No collection has run yet.</pre>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
